<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird: Rizzler Edition</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background-color: #ff9a9e; /* Pink vibe */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column; overflow: hidden;
        }
        #gameCanvas { border: 4px solid #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); cursor: pointer; }
        #score { font-size: 3em; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2em; color: white; text-align: center; background: rgba(0, 0, 0, 0.4);
            padding: 20px; border-radius: 15px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="score">0</div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div id="message" class="message">Click to play "Oui" by Jeremih</div>

    <audio id="bgMusic" loop>
        <source src="soundtrack.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgMusic = document.getElementById('bgMusic');
        const messageDiv = document.getElementById('message');

        // --- Rizzler Physics (Slower & Smoother) ---
        const GRAVITY = 0.22;
        const JUMP = -5;
        const PIPE_SPEED = 2.0;
        const PIPE_GAP = 170;
        
        let bird = { x: 50, y: 250, velocity: 0 };
        let pipes = [];
        let score = 0;
        let isPlaying = false;

        function draw() {
            // Background
            ctx.fillStyle = '#60c9f1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isPlaying) {
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;

                if (frameCount % 120 === 0) {
                    pipes.push({ x: canvas.width, top: Math.random() * (canvas.height - PIPE_GAP - 100) + 50 });
                }

                pipes.forEach((p, i) => {
                    p.x -= PIPE_SPEED;
                    ctx.fillStyle = "#4CAF50";
                    ctx.fillRect(p.x, 0, 50, p.top); // Top Pipe
                    ctx.fillRect(p.x, p.top + PIPE_GAP, 50, canvas.height); // Bottom Pipe

                    if (p.x === 50) { score++; document.getElementById('score').innerText = score; }
                    if (p.x < -50) pipes.splice(i, 1);

                    // Collision
                    if (bird.x + 25 > p.x && bird.x < p.x + 50 && (bird.y < p.top || bird.y + 25 > p.top + PIPE_GAP)) reset();
                });

                if (bird.y > canvas.height || bird.y < 0) reset();
            }

            // Draw Bird (Simplified)
            ctx.fillStyle = "#FFC107";
            ctx.beginPath();
            ctx.arc(bird.x + 12, bird.y + 12, 12, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(draw);
        }

        let frameCount = 0;
        setInterval(() => { if (isPlaying) frameCount++; }, 10);

        function reset() {
            isPlaying = false;
            bird = { x: 50, y: 250, velocity: 0 };
            pipes = [];
            score = 0;
            document.getElementById('score').innerText = score;
            messageDiv.style.display = "block";
            bgMusic.pause();
            bgMusic.currentTime = 0;
        }

        canvas.addEventListener('mousedown', () => {
            if (!isPlaying) {
                isPlaying = true;
                messageDiv.style.display = "none";
                bgMusic.play();
            }
            bird.velocity = JUMP;
        });

        draw();
    </script>
</body>
</html>
